name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web to Android
        run: npx cap sync android

      - name: Force Landscape Orientation
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('android/app/src/main/AndroidManifest.xml')
root = tree.getroot()
for activity in root.findall('.//activity'):
    activity.set('{http://schemas.android.com/apk/res/android}screenOrientation', 'sensorLandscape')
tree.write('android/app/src/main/AndroidManifest.xml')
" 

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuraSnake-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
