<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON VIPER 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hud-group">
    <div>SCORE<span class="val" id="scoreEl">0</span></div>
    <div>BEST<span class="val" id="bestEl">0</span></div>
  </div>
  <div class="hud-group">
    <div class="speed-badge" id="speedBadge">1.0x SPEED</div>
    <div class="hud-btn" id="muteBtn" title="Toggle Sound">
      <svg id="audioOnIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg id="audioOffIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </div>
    <div class="hud-btn" id="settingsBtn" title="Steering Sensitivity">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.95s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </div>
  </div>
</div>

<!-- START / GAME OVER OVERLAY -->
<div id="startOverlay" class="modal-overlay show">
  <div class="panel">
    <h1 id="ovTitle">NEON VIPER 3D</h1>
    <p class="sub" id="ovSub">
      Drag <b>STEERING WHEEL</b> left / right to turn<br>
      Push <b>UP</b> for Boost • Pull <b>DOWN</b> for Brake<br>
      <span class="dim">Keyboard: A/D (Steer) • W/S (Speed)</span>
    </p>
    <div id="ovScoreWrap" style="display:none">
      <div class="bigscore" id="ovScore">0</div>
      <div class="lbl">FINAL SCORE</div>
    </div>
    <button class="btn-action" id="startBtn">START VIPER</button>
  </div>
</div>

<!-- SENSITIVITY SETTINGS MODAL -->
<div id="settingsOverlay" class="modal-overlay">
  <div class="panel">
    <h1>STEERING SETUP</h1>
    <p class="sub">Calibrate steering response & turning speed</p>

    <div class="slider-wrap">
      <div class="slider-label">
        <span>SENSITIVITY MULTIPLIER</span>
        <span id="sensValText">1.00x</span>
      </div>
      <input type="range" id="sensSlider" class="sens-range" min="0.3" max="2.5" step="0.05" value="1.0">
      <div class="gauge-bg">
        <div id="gaugeFill" class="gauge-fill"></div>
      </div>
      <div class="preset-grid">
        <button class="preset-btn" data-sens="0.6">CHILL 0.6x</button>
        <button class="preset-btn active" data-sens="1.0">NORMAL 1.0x</button>
        <button class="preset-btn" data-sens="1.6">PRO 1.6x</button>
      </div>
    </div>

    <button class="btn-action" id="closeSettingsBtn">RESUME GAME</button>
  </div>
</div>

<!-- STEERING WHEEL WIDGET -->
<div id="wheel-container">
  <div class="wheel-hint top">▲ BOOST</div>
  <div class="wheel-hint bottom">▼ BRAKE</div>
  <svg id="wheel-svg" viewBox="0 0 200 200">
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
        <stop offset="70%" stop-color="#141c2b"/>
        <stop offset="92%" stop-color="#2a384e"/>
        <stop offset="100%" stop-color="#090d15"/>
      </radialGradient>
      <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#22485e"/>
        <stop offset="85%" stop-color="#0a1826"/>
        <stop offset="100%" stop-color="#040c14"/>
      </radialGradient>
      <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4a5f78"/>
        <stop offset="50%" stop-color="#1e2d40"/>
        <stop offset="100%" stop-color="#0f1926"/>
      </linearGradient>
    </defs>
    <circle cx="100" cy="100" r="90" fill="url(#rimGrad)" stroke="#4affc4" stroke-width="3" stroke-opacity="0.4"/>
    <circle cx="100" cy="100" r="72" fill="none" stroke="#04070f" stroke-width="4"/>
    <path d="M 94 10 L 106 10 L 103 26 L 97 26 Z" fill="#ff2e64"/>
    <path d="M 96 10 L 104 10 L 102 26 L 98 26 Z" fill="#4affc4"/>
    <rect x="12" y="90" width="16" height="20" rx="3" fill="#3a4b63" opacity="0.6"/>
    <rect x="172" y="90" width="16" height="20" rx="3" fill="#3a4b63" opacity="0.6"/>
    <polygon points="100,100 28,105 32,125 100,108" fill="url(#spokeGrad)" stroke="#1a2736" stroke-width="1"/>
    <polygon points="100,100 172,105 168,125 100,108" fill="url(#spokeGrad)" stroke="#1a2736" stroke-width="1"/>
    <polygon points="94,100 106,100 104,170 96,170" fill="url(#spokeGrad)" stroke="#1a2736" stroke-width="1"/>
    <circle cx="100" cy="100" r="32" fill="url(#hubGrad)" stroke="#5ff0c0" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="100" cy="100" r="26" fill="none" stroke="#4affc4" stroke-width="1" stroke-dasharray="4 2"/>
    <path d="M 100 86 L 109 98 L 104 112 L 100 110 L 96 112 L 91 98 Z" fill="#5ff0c0"/>
    <circle cx="97" cy="95" r="1.5" fill="#04070f"/>
    <circle cx="103" cy="95" r="1.5" fill="#04070f"/>
  </svg>
</div>

<div id="fatal"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
